# slappyshot sample configuration.
#
# Copy to ~/.config/slappyshot/config.toml (or $XDG_CONFIG_HOME/slappyshot/),
# or point at it with --config. Every setting below is optional and shown at
# its default, so copying this file as it stands changes nothing -- except
# copy-command and output-filename, which have no default and are commented
# out.
#
# Keys are snake_case, and a key spelled any other way is ignored in silence
# rather than refused. If a setting appears to do nothing, check its spelling
# here first.

[general]

# --- Window

# Start fullscreen.
fullscreen = false
# Ask the compositor for a window with no titlebar or border. It has the final
# say, and on Wayland this needs xdg-decoration-unstable-v1.
no_window_decoration = false
# Hide both toolbars on startup. Ctrl+T toggles them at any time.
default_hide_toolbars = false

# --- What opens, and what is remembered

# The tool selected on startup, until there is a remembered one -- see
# remember_last_used below. [pointer, crop, brush, line, arrow, rectangle,
# ellipse, text, marker, blur, highlight, delete]
initial_tool = "arrow"
# Carry the tool, size and colour over from the last run, so a session spent
# drawing red arrows opens on a red arrow. Kept in
# ~/.local/state/slappyshot/state.toml, which is safe to delete.
remember_last_used = true
# Fill shapes by default. `f` toggles it.
default_fill_shapes = false
# The highlighter reached for first; the other one is available by holding
# Ctrl as a highlight starts. [block, freehand]
primary_highlighter = "block"

# --- Drawing

# Corner radius for rectangles, in pixels. 0 for square corners.
corner_roundness = 12
# Scale every annotation up or down: line widths, arrowheads, text, markers.
annotation_size_factor = 1.0
# Smoothing applied to freehand brush strokes, as a number of points of
# history. 0 disables it.
brush_smooth_history_size = 5

# --- Zoom and pan

# Fit the image to the window on startup. Only ever scales down: a capture
# smaller than the window is shown at 100% rather than magnified.
zoom_to_fit = true
# How far one scroll tick or one press of +/- moves the zoom.
zoom_factor = 1.1
# How far an arrow key pans, in pixels. Panning needs the Pointer tool.
pan_step_size = 50.0
# Points to leave free along each edge when a capture is large enough that the
# window would otherwise fill the whole usable area.
#
# This has to cover the window border as well as the gap you want to see,
# because a compositor draws the border OUTSIDE the size the window asks for
# and no protocol tells a client how wide it is. The default leaves 2 points
# showing beside a 3 point border; raise it if yours is thicker, lower it to 0
# to go back to filling the usable area exactly.
window_margin = 5.0

# --- Output

# Where "save" writes, with chrono format specifiers expanded:
# https://docs.rs/chrono/latest/chrono/format/strftime/index.html
# Unset means /tmp/slappyshot-<timestamp>.png.
# output_filename = "~/Pictures/slappyshot-%Y-%m-%d_%H:%M:%S.png"

# A command to pipe the PNG into on copy, e.g. wl-copy. Unset uses the built-in
# clipboard, which speaks both Wayland and X11.
# copy_command = "wl-copy"

# Also write the file every time the image is copied.
save_after_copy = false

# --- Actions
#
# Run in the order given. [save_to_clipboard, save_to_file, exit]

actions_on_enter = ["save_to_clipboard", "exit"]
actions_on_escape = ["exit"]
actions_on_right_click = []

# Hex colours offered in the bottom toolbar. The first is selected on a fresh
# start, and the first eight answer to the number keys 1-8.
[color_palette]
palette = [
    "#f0932b",
    "#eb4d4b",
    "#6ab04c",
    "#22a6b3",
    "#130f40",
    "#c825b8",
    "#ffffff",
    "#000000",
]

# One key per tool. Shown below at their defaults; only the ones you change
# need to be listed.
[keybinds]
pointer   = "p"
crop      = "x"
brush     = "b"
line      = "l"
arrow     = "a"
rectangle = "r"
ellipse   = "e"
text      = "t"
marker    = "m"
blur      = "w"
highlight = "h"
delete    = "d"

# Hex colours for the toolbars themselves. Each is optional, and anything left
# out keeps egui's dark theme.
[theme]
panel_fill    = "#1e1e23"
text_color    = "#ffffff"
button_fill   = "#2a2a2f"
button_active = "#f0932b"

# --- Accepted and ignored
#
# These parse without complaint and then do nothing. They are listed here so
# that nobody spends an afternoon wondering why, and left out above so that
# nobody copies them expecting an effect:
#
#   [general] floating_hack, early_exit, auto_copy, disable_notifications
#   [font]    family, style, fallback
#
# The two command line flags --early-exit and --auto-copy are the same story.
# Text annotations use the system font egui resolves for itself; [font] is not
# consulted.
