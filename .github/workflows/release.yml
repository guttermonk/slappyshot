name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # So the whole thing can be exercised without tagging. That matters here:
  # tags in this repository are signed by a hardware key, so tagging is not
  # something to do speculatively to find out whether the packaging works. A
  # dispatch run builds every package and uploads them as workflow artifacts
  # without creating a release.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Used for naming only. The build is native -- see the build step.
  TARGET: x86_64-unknown-linux-gnu

permissions:
  contents: read

jobs:
  release:
    # Deliberately not ubuntu-latest. Nothing but libc, libm and libgcc_s is
    # linked -- wayland-sys is built with its dlopen feature, and X11 and
    # xkbcommon arrive through x11-dl and xkbcommon-dl, which dlopen too -- so
    # the glibc of the build machine is the only thing deciding where these
    # packages can run. ubuntu-latest is 24.04 and glibc 2.39, which would
    # leave out Debian 12 (2.36) and Ubuntu 22.04 itself (2.35) for no gain.
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    # Read by the arch job below, which cannot see this one's step outputs.
    outputs:
      version: ${{ steps.version.outputs.version }}
      name: ${{ steps.version.outputs.name }}

    steps:
      # No system libraries to install, for the dlopen reasons above: nothing
      # links against a -dev package at build time.
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      # Not install-action: cargo-generate-rpm is not among the tools it
      # carries. rust-cache keeps ~/.cargo/bin, so this is only slow once.
      - name: Install cargo-generate-rpm
        run: cargo install --locked cargo-generate-rpm

      - name: Resolve the version
        id: version
        run: |
          cargo_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[0].version')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            # A tag disagreeing with Cargo.toml would ship packages whose
            # filenames and recorded versions differ, and the version lives in
            # two places by hand (Cargo.toml and flake.nix). Fail loudly here
            # rather than publish that.
            if [ "$tag_version" != "$cargo_version" ]; then
              echo "::error::tag v${tag_version} does not match Cargo.toml version ${cargo_version}"
              exit 1
            fi
          fi
          echo "version=${cargo_version}" >> "$GITHUB_OUTPUT"
          echo "name=slappyshot-${cargo_version}-${TARGET}" >> "$GITHUB_OUTPUT"

      # Native, so the binary lands at the plain target/release/slappyshot that
      # the asset paths in Cargo.toml name. Building --target x86_64-unknown-
      # linux-gnu instead would put it under target/<triple>/release and leave
      # both packagers looking in the wrong place.
      - name: Build
        run: cargo build --release --locked

      - name: Stage the manpage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # build.rs renders the page into OUT_DIR, whose directory name
          # carries a build hash, so it has to be found rather than named --
          # the same dance flake.nix and the Makefile do. Deliberately not
          # guarded with `|| true`: every package below lists this path, and a
          # silent skip would ship them all with `man slappyshot` empty.
          #
          # Newest, and under release/ only, where this used to take the first
          # thing `find target` offered. A target directory holds one OUT_DIR
          # per version ever built in it, and the cache carries them between
          # runs, so `head -1` was picking by filesystem order among pages for
          # several different versions. On the machine this was written on
          # that is fifteen pages across three versions, and head -1 chose
          # 0.1.0. CI has happened to choose right so far, which is not the
          # same as having been made to.
          mkdir -p target/dist/man
          page="$(find target/release/build -name slappyshot.1 -printf '%T@ %p\n' \
            | sort -rn | head -1 | cut -d' ' -f2-)"
          test -n "$page"
          cp "$page" target/dist/man/slappyshot.1

          # And the assertion that makes the choosing merely an optimisation.
          # Every package below ships this file, so a stale one would go out in
          # all four at once, saying the wrong version to anyone who ran `man
          # slappyshot` and to nobody else -- which is how it would survive a
          # release or two before turning into a confusing bug report.
          grep -q "slappyshot ${VERSION}" target/dist/man/slappyshot.1

      - name: Tarball
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          # Staged under target/ rather than the repository root so that
          # running any of this by hand does not leave untracked directories
          # next to the source.
          stage="target/pkg/${NAME}"
          rm -rf "$stage" && mkdir -p "$stage"
          cp target/release/slappyshot -t "$stage"
          install -Dm644 target/dist/man/slappyshot.1 "$stage/man/slappyshot.1"
          cp -r README.md LICENSE assets slappyshot.desktop -t "$stage"
          tar -zcf "target/dist/${NAME}.tar.gz" -C "$stage" .

      # Rendered rather than committed whole, because half of it is the
      # checksum of a tarball that did not exist until the step above ran. The
      # template is packaging/aur/PKGBUILD.in; see its header for what is still
      # a manual step (.SRCINFO, which needs makepkg).
      - name: Arch PKGBUILD
        env:
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha="$(sha256sum "target/dist/${NAME}.tar.gz" | cut -d' ' -f1)"
          sed -e "s|@PKGVER@|${VERSION}|g" -e "s|@SHA256@|${sha}|g" \
            packaging/aur/PKGBUILD.in > target/dist/PKGBUILD
          # A token that survived means either a renamed placeholder or a sed
          # that silently matched nothing, and the package would then fetch
          # from a URL with the word PKGVER in it, or check against a checksum
          # that is not one. Neither fails until somebody tries to install it.
          if grep -q '@[A-Z0-9_]*@' target/dist/PKGBUILD; then
            echo "::error::PKGBUILD still contains an unsubstituted token"
            exit 1
          fi
          cat target/dist/PKGBUILD

      - name: Debian package
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: cargo deb --no-build --output "target/dist/${NAME}.deb"

      - name: RPM package
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: cargo generate-rpm --output "target/dist/${NAME}.rpm"

      - name: AppImage
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: x86_64
          # The runners have no FUSE, so appimagetool cannot mount itself.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          appdir=target/AppDir
          install -Dm755 target/release/slappyshot "$appdir/usr/bin/slappyshot"
          install -Dm644 slappyshot.desktop \
            "$appdir/usr/share/applications/slappyshot.desktop"
          install -Dm644 assets/slappyshot.png \
            "$appdir/usr/share/icons/hicolor/256x256/apps/slappyshot.png"
          install -Dm644 target/dist/man/slappyshot.1 \
            "$appdir/usr/share/man/man1/slappyshot.1"

          # appimagetool wants the desktop file and the icon at the top of the
          # AppDir as well, and reads .DirIcon for the thumbnail.
          ln -sf usr/share/applications/slappyshot.desktop "$appdir/slappyshot.desktop"
          ln -sf usr/share/icons/hicolor/256x256/apps/slappyshot.png "$appdir/slappyshot.png"
          ln -sf slappyshot.png "$appdir/.DirIcon"

          # Hand-written rather than linuxdeploy's, because there is nothing to
          # bundle: the libraries this program actually uses are dlopened and
          # have to come from the host regardless. Shipping a GL or Wayland
          # stack inside the image is how AppImages break on other people's
          # drivers. `exec` is not incidental -- slappyshot is normally handed
          # its capture on stdin, and a wrapper that does not exec would sit
          # between the pipe and the program.
          # Single-quoted so that $HERE, $0 and $@ reach the generated script
          # rather than being expanded while generating it, which is the whole
          # point of writing it this way.
          # shellcheck disable=SC2016
          printf '%s\n' \
            '#!/bin/sh' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'exec "$HERE/usr/bin/slappyshot" "$@"' > "$appdir/AppRun"
          chmod +x "$appdir/AppRun"

          curl -fsSLo appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool "$appdir" "target/dist/slappyshot-${VERSION}-${ARCH}.AppImage"

      # rpm is not promised by the runner image, and the step below asserts
      # against it rather than skipping when it is absent.
      - name: Install rpm
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm

      # Cheap, and the failure it catches is the expensive one: a package that
      # installs and then cannot start. The greps assert the hand-written
      # dependencies from Cargo.toml actually made it into both packages,
      # because the automatic discovery would have found only libc.
      - name: Inspect the packages
        run: |
          dpkg-deb --info target/dist/*.deb
          dpkg-deb --contents target/dist/*.deb
          # The assertion that matters. dpkg-shlibdeps sees a program needing
          # only a C library, so if the hand-written list in Cargo.toml ever
          # goes missing the package still builds -- and then fails to start
          # on a machine without a GL stack. Unguarded on purpose.
          dpkg-deb --field target/dist/*.deb Depends | grep -q libegl1

          # The rpm's turn. Installed above rather than guarded with `command
          # -v`, which is what this used to do: a check that quietly does not
          # run is not a check, and the rich dependency below is the subtlest
          # thing either package carries.
          rpm -qpi target/dist/*.rpm
          rpm -qpR target/dist/*.rpm
          rpm -qpR target/dist/*.rpm | grep -q 'libEGL.so.1'
          # Rich dependencies are a name beginning with "(" plus a flag, and a
          # tool that wrote the name without the flag would produce a package
          # demanding a literal dependency called "(libwayland-client.so.0...)"
          # -- satisfiable nowhere, and uninstallable on every distribution
          # rather than merely under-specified. rpm prints the rpmlib feature
          # only when the flag is really set, so that is what is asserted.
          rpm -qpR target/dist/*.rpm | grep -q 'rpmlib(RichDependencies)'
          rpm -qpR target/dist/*.rpm | grep -q '^(libwayland-client.so.0.* or libX11.so.6'

          # Only for the log, and not promised by the runner image.
          if command -v desktop-file-validate >/dev/null; then
            desktop-file-validate slappyshot.desktop
          fi
          ls -l target/dist

      - name: Checksums
        run: |
          cd target/dist
          sha256sum ./*.tar.gz ./*.deb ./*.rpm ./*.AppImage > SHA256SUMS
          cat SHA256SUMS

      # Draft, so there is a chance to look at the artifacts and write the
      # notes before any of it is public. Publishing stays a manual step.
      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            target/dist/*.tar.gz
            target/dist/*.deb
            target/dist/*.rpm
            target/dist/*.AppImage
            target/dist/PKGBUILD
            target/dist/SHA256SUMS

      # Unconditional, where this used to be dispatch-only: the arch job below
      # needs the tarball and the PKGBUILD on a tag run too, and an artifact is
      # the only way to hand files to a job in a different container.
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: slappyshot-packages
          path: target/dist/*
          if-no-files-found: error

  # The PKGBUILD had never been near makepkg -- it was reasoned about, and its
  # package() run by hand against a tarball, which is not the same thing. This
  # job is the proof, and it is also the only place .SRCINFO can come from: the
  # AUR will not accept a push without one, and only makepkg writes it.
  arch:
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    permissions:
      contents: write

    steps:
      # The three runtime libraries are installed because makepkg checks
      # depends before it builds and stops if any is missing. base-devel
      # already carries fakeroot, binutils and the rest of what it needs.
      - name: Tools
        run: |
          pacman -Syu --noconfirm --needed namcap github-cli \
            libglvnd libxkbcommon wayland

      - uses: actions/download-artifact@v4
        with:
          name: slappyshot-packages
          path: dist

      - name: Build the package
        env:
          VERSION: ${{ needs.release.outputs.version }}
          NAME: ${{ needs.release.outputs.name }}
        run: |
          mkdir -p build
          cp dist/PKGBUILD build/

          # source= points at a release asset, which does not exist yet on a
          # tag run and never will on a dispatch one. makepkg uses a file
          # already sitting beside the PKGBUILD under the name the `::` rename
          # gives it rather than fetching, so this both avoids the download
          # and makes the build check the rendered sha256sums against the very
          # tarball this run produced -- the one thing the sed could get wrong
          # that a surviving-token check would not catch.
          cp "dist/${NAME}.tar.gz" "build/slappyshot-${VERSION}.tar.gz"

          # makepkg refuses to run as root and a container is root.
          useradd -m builder
          chown -R builder:builder build

          su builder -c 'cd build && makepkg --printsrcinfo > .SRCINFO'
          su builder -c 'cd build && makepkg -f --noconfirm'
          ls -l build

      - name: Inspect the package
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # Named and not globbed. The glob this used to be matched two files
          # the first time it ran -- makepkg.conf carries `debug` in OPTIONS
          # and had split out a -debug package -- and handed both to bsdtar as
          # one filename with a newline in it. The PKGBUILD now says !debug,
          # so naming the file is also the assertion that it did: a second
          # package, or a pkgver that failed to render, fails here rather than
          # being whatever `ls` happened to put first.
          pkg="build/slappyshot-bin-${VERSION}-1-x86_64.pkg.tar.zst"
          test -f "$pkg"
          bsdtar -tf "$pkg" | sort
          # The same assertion the deb and rpm get: a package that installs
          # and then has no program in it is the failure worth catching.
          bsdtar -tf "$pkg" | grep -qx 'usr/bin/slappyshot'
          # .gz optional, not assumed: makepkg.conf carries `zipman`, so the
          # page arrives compressed and an exact match on the name the
          # PKGBUILD installs fails. What is being asserted is that the page
          # is in the package at all -- whether it is compressed on the way is
          # makepkg's business and man reads it either way.
          bsdtar -tf "$pkg" | grep -qE '^usr/share/man/man1/slappyshot\.1(\.gz)?$'
          cat build/.SRCINFO

          # For the log and not a gate. namcap reads DT_NEEDED like every
          # other dependency checker, so it sees a program that needs libc and
          # calls libglvnd, libxkbcommon and wayland unnecessary. That blind
          # spot is exactly why the lists are hand-written; failing on it would
          # mean deleting the dependencies that make the package work.
          namcap build/PKGBUILD || true
          namcap "$pkg" || true

      # One archive rather than two loose assets, because GitHub will not take
      # an asset whose name begins with a dot. In v0.1.2 it accepted the
      # upload and renamed it: .SRCINFO arrived as default.SRCINFO, which a
      # packager has to notice and undo, and which looks like a stray file to
      # anyone who does not already know what it is.
      #
      # Inside an archive the name survives. Flat, and in that order, because
      # an AUR repository is a git clone with exactly these two files at its
      # root -- so this extracts into one and is ready to commit.
      - name: Pack the AUR files
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          aur="build/slappyshot-bin-${VERSION}-aur.tar.gz"
          tar -czf "$aur" -C build PKGBUILD .SRCINFO
          # -F, so the dot in .SRCINFO is a dot. Unanchored and unescaped it
          # is a regex matching any character, which would make this pass on
          # an archive containing xSRCINFO -- a check that cannot fail is the
          # thing being guarded against here, the dot being the entire reason
          # this step exists.
          tar -tzf "$aur" | grep -qxF 'PKGBUILD'
          tar -tzf "$aur" | grep -qxF '.SRCINFO'
          tar -tzf "$aur"

      - name: Attach the AUR files to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "build/slappyshot-bin-${VERSION}-aur.tar.gz" \
            --clobber --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v4
        with:
          name: slappyshot-aur
          path: |
            build/PKGBUILD
            build/.SRCINFO
            build/slappyshot-bin-*-aur.tar.gz
          # Since v4.4 this action drops dotfiles unless told otherwise, and
          # .SRCINFO is the whole point of the job. Without it the upload
          # would have succeeded with one of the files in it, if-no-files
          # -found having no opinion about a path that matched nothing as long
          # as another one did. The archive is proof against that by itself;
          # the loose pair stays so a dispatch run can be looked at without
          # unpacking anything.
          include-hidden-files: true
          if-no-files-found: error
