name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      # No system libraries to install: wayland-sys is built with its dlopen
      # feature, and X11 and xkbcommon arrive through x11-dl and xkbcommon-dl,
      # which dlopen too. Nothing links against a -dev package at build time.
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Pack Artifacts
        if: matrix.os == 'ubuntu-latest'
        env:
          RELEASE_NAME: slappyshot-${{ matrix.target }}
          ARTIFACTS_DIR: target/${{ matrix.target }}/release
        run: |
          mkdir $RELEASE_NAME
          cp target/${{ matrix.target }}/release/slappyshot -t $RELEASE_NAME
          # The manpage build.rs renders into OUT_DIR; its directory name
          # carries a build hash, so it has to be found rather than named.
          install -Dm644 "$(find target -name slappyshot.1 | head -1)" \
            $RELEASE_NAME/man/slappyshot.1
          cp -r README.md assets LICENSE slappyshot.desktop -t $RELEASE_NAME
          tar -zcvf $RELEASE_NAME.${{ matrix.archive }} -C $RELEASE_NAME .

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: slappyshot-${{ matrix.target }}.${{ matrix.archive }}

