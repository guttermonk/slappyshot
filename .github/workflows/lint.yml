name: lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # So a topic branch can be checked before it is merged: the triggers above
  # only fire for main, and this repository merges rather than opening PRs.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo clippy --locked --all-features --all-targets \
            -- -D warnings
