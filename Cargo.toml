[package]
name = "slappyshot"
version = "0.1.3"
edition = "2024"
description = "Screenshot annotation tool"
license = "MPL-2.0"
repository = "https://github.com/guttermonk/slappyshot"
readme = "README.md"

[[bin]]
name = "slappyshot"
path = "src/main.rs"

[dependencies]
eframe    = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui      = { version = "0.37", features = ["monochrome_emoji_fonts"] }
image     = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
clap      = { version = "4", features = ["derive"] }
serde     = { version = "1", features = ["derive"] }
toml      = "1"
chrono    = "0.4"
xdg       = "3"
anyhow    = "1"
ab_glyph  = "0.2"
imageproc = "0.27"
arboard   = "3"
notify-rust = "4"
notosans  = "0.1"
# Asking the compositor how big the screen really is, before the window is
# built -- see src/screen.rs. Both of these are already in the tree underneath
# eframe (winit speaks Wayland through them), so naming them here adds code to
# write and none to compile. default-features off leaves out calloop and
# xkbcommon, which are an event loop and a keyboard this has no use for.
smithay-client-toolkit = { version = "0.21", default-features = false }
wayland-client = "0.31"

[build-dependencies]
clap          = { version = "4", features = ["derive"] }
clap_mangen   = "0.3"

# Packaging metadata, read by cargo-deb and cargo-generate-rpm. See
# .github/workflows/release.yml, which drives both.
#
# The dependency lists below are hand-written, and have to be. Nothing but
# libc, libm and libgcc_s appears in the binary's DT_NEEDED -- wayland-sys is
# built with its dlopen feature, and X11 and xkbcommon arrive through x11-dl
# and xkbcommon-dl, which dlopen too. So the usual automatic dependency
# discovery (dpkg-shlibdeps for deb, rpm's find-requires for rpm) sees a
# program that needs nothing but a C library, and a package built on its word
# installs perfectly and then dies at startup with no display and no GL.
#
# The manpage is not in the source tree: build.rs renders it into OUT_DIR,
# whose directory name carries a build hash. The release workflow finds it and
# stages it at the path below before either packager runs.

[package.metadata.deb]
maintainer = "guttermonk <guttermonk@protonmail.com>"
copyright = "2026, guttermonk"
license-file = ["LICENSE", "0"]
section = "graphics"
priority = "optional"
# $auto keeps the libc6 dependency cargo-deb derives from the ELF, which is
# what encodes the glibc floor of the machine this was built on.
depends = "$auto, libegl1, libgl1, libxkbcommon0, libwayland-client0 | libx11-6"
# Not depends: slappyshot annotates an image handed to it on stdin and does no
# capturing of its own, so it runs without these -- they are just how anyone
# on Wayland actually feeds it. See the example in `slappyshot --help`.
recommends = "grim, slurp"
extended-description = """
Annotate a screenshot: crop it, draw on it, blur what should not be shared, \
then save it or put it on the clipboard. Reads an image from a file or from \
standard input, which is how it is usually reached -- with a region grabber \
piping into it."""
assets = [
    ["target/release/slappyshot", "usr/bin/", "755"],
    ["slappyshot.desktop", "usr/share/applications/", "644"],
    ["assets/slappyshot.png", "usr/share/icons/hicolor/256x256/apps/slappyshot.png", "644"],
    ["target/dist/man/slappyshot.1", "usr/share/man/man1/", "644"],
    ["README.md", "usr/share/doc/slappyshot/README.md", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/slappyshot", dest = "/usr/bin/slappyshot", mode = "755" },
    { source = "slappyshot.desktop", dest = "/usr/share/applications/slappyshot.desktop", mode = "644" },
    { source = "assets/slappyshot.png", dest = "/usr/share/icons/hicolor/256x256/apps/slappyshot.png", mode = "644" },
    { source = "target/dist/man/slappyshot.1", dest = "/usr/share/man/man1/slappyshot.1", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/slappyshot/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/slappyshot/LICENSE", mode = "644", doc = true },
]

# Written as sonames rather than package names because those differ across the
# rpm distributions (mesa-libEGL on Fedora, libEGL1 on openSUSE) while the
# library filename does not.
#
# The last one is a rich dependency, rpm's spelling of the deb's
# `libwayland-client0 | libx11-6`: the program needs one display protocol or
# the other and not both, and a plain Requires cannot say so. Rich deps want
# rpm 4.13, which is Fedora 24, RHEL 8 and Leap 15 -- older than anything this
# can run on for glibc reasons anyway. Verified to come out as a real rich
# dependency rather than a literal name; see the assertion in release.yml.
[package.metadata.generate-rpm.requires]
"libEGL.so.1()(64bit)" = "*"
"libGL.so.1()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"(libwayland-client.so.0()(64bit) or libX11.so.6()(64bit))" = "*"
